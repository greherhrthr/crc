<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox API — прямой запрос</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #ff4757; }
    .container {
      background: #2d2d44;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    input, button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin: 5px;
    }
    input { width: 60%; background: #3d3d5c; color: #fff; }
    button {
      background: #ff4757;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #ff6b81; }
    #result {
      margin-top: 20px;
      background: #111;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: monospace;
      border-left: 4px solid #ff4757;
    }
    .error { color: #ff6b81; }
    .success { color: #2ed573; }
    .info { color: #1e90ff; }
    .small { font-size: 0.9em; color: #aaa; }
  </style>
</head>
<body>

<div class="container">
  <h1>🔥 Roblox API Fetcher</h1>
  <p class="small">Прямой запрос без JSONP, с обработкой CORS и ошибок</p>

  <div>
    <input type="text" id="apiUrl" value="https://users.roblox.com/v1/users/1" placeholder="Введите URL Roblox API">
    <button onclick="fetchData()">Получить данные</button>
    <button onclick="fetchViaProxy()" style="background:#2ed573;">🌐 Через прокси</button>
  </div>
  <div style="margin-top:10px;">
    <button onclick="useExample()" class="small" style="background:#3742fa;">Пример: пользователь</button>
    <button onclick="useInventory()" class="small" style="background:#3742fa;">Пример: инвентарь</button>
  </div>

  <div id="result">Ожидание запроса...</div>
  <div id="status" class="small" style="margin-top:8px;">Готов</div>
</div>

<script>
  // ===== ОСНОВНАЯ ФУНКЦИЯ FETCH С ЗАГОЛОВКАМИ =====
  async function fetchRobloxAPI(url, options = {}) {
    const headers = {
      'Accept': 'application/json',
      'Content-Type': 'application/json',
      ...options.headers
    };

    const response = await fetch(url, {
      method: options.method || 'GET',
      headers: headers,
      credentials: 'include', // если нужны куки
      ...options
    });

    if (!response.ok) {
      const errText = await response.text().catch(() => '');
      throw new Error(`HTTP ${response.status}: ${response.statusText} — ${errText.substring(0, 100)}`);
    }

    return await response.json();
  }

  // ===== ПРОКСИ (обход CORS) =====
  async function fetchViaProxy(url) {
    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
    const response = await fetch(proxyUrl);
    if (!response.ok) throw new Error(`Прокси ответил ${response.status}`);
    return await response.json();
  }

  // ===== ОБРАБОТЧИКИ ИНТЕРФЕЙСА =====
  const resultDiv = document.getElementById('result');
  const statusDiv = document.getElementById('status');

  function setStatus(text, type = 'info') {
    statusDiv.innerHTML = `<span class="${type}">${text}</span>`;
  }

  function displayData(data) {
    resultDiv.innerHTML = JSON.stringify(data, null, 2);
    setStatus('✅ Данные получены успешно', 'success');
  }

  function displayError(err) {
    resultDiv.innerHTML = `<span class="error">❌ Ошибка: ${err.message}</span>`;
    setStatus(`Ошибка: ${err.message}`, 'error');
    console.error(err);
  }

  // ===== ЗАПРОС ПО КНОПКЕ =====
  async function fetchData() {
    const url = document.getElementById('apiUrl').value.trim();
    if (!url) {
      displayError(new Error('Введите URL Roblox API'));
      return;
    }

    resultDiv.innerHTML = '⏳ Запрос выполняется...';
    setStatus('Идёт запрос...', 'info');

    try {
      const data = await fetchRobloxAPI(url);
      displayData(data);
    } catch (err) {
      // Если ошибка CORS, предлагаем прокси
      if (err.message.includes('CORS') || err.message.includes('Failed to fetch')) {
        setStatus('⚠️ CORS ошибка, попробуйте через прокси', 'error');
        resultDiv.innerHTML = `⚠️ Ошибка CORS. Нажмите кнопку "Через прокси" или используйте прокси-сервер.`;
      } else {
        displayError(err);
      }
    }
  }

  // ===== ЧЕРЕЗ ПРОКСИ =====
  async function fetchViaProxy() {
    const url = document.getElementById('apiUrl').value.trim();
    if (!url) {
      displayError(new Error('Введите URL Roblox API'));
      return;
    }

    resultDiv.innerHTML = '⏳ Запрос через прокси...';
    setStatus('Идёт запрос через прокси...', 'info');

    try {
      const data = await fetchViaProxy(url);
      displayData(data);
    } catch (err) {
      displayError(err);
    }
  }

  // ===== ПРИМЕРЫ =====
  function useExample() {
    document.getElementById('apiUrl').value = 'https://users.roblox.com/v1/users/1';
    fetchData();
  }

  function useInventory() {
    document.getElementById('apiUrl').value = 'https://inventory.roblox.com/v1/users/1/inventory?limit=10';
    fetchData();
  }

  // ===== АВТОМАТИЧЕСКИЙ ЗАПРОС ПРИ ЗАГРУЗКЕ =====
  window.addEventListener('load', () => {
    // Можно раскомментировать для авто-запроса
    // fetchData();
    setStatus('Готов. Введите URL и нажмите "Получить данные"', 'info');
  });
</script>

</body>
</html>
